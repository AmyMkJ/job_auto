<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Summer 2027 · Job Auto</title>
<style>body{font:16px system-ui;background:#f3f5fa;color:#17223c;max-width:1100px;margin:50px auto;padding:20px}h1{font-size:38px}button,select,input{padding:10px;border:1px solid #ccd2df;border-radius:8px;background:white;margin:4px}button{cursor:pointer}article{background:white;padding:22px;border-radius:16px;margin:16px 0;border:1px solid #e1e5ef}a{color:#3158be}small{color:#60708d}.tags{color:#416bb3}#message{white-space:pre-wrap}header{margin-bottom:30px}</style>
<header><small>JOB AUTO · INTERNSHIP SEARCH</small><h1>你的下一站，Summer 2027</h1><p>软件开发 · 数据工程 · DevOps · 自动化测试</p><button id="refresh">收集最新岗位</button><span id="message"></span></header>
<input id="location" placeholder="筛选地区，如 Toronto / Canada"><label><input type="checkbox" id="confirmed" checked>只看明确 Summer 2027</label><label>最近发现 <select id="days"><option value="14">14 天</option><option value="30">30 天</option><option value="9999">全部</option></select></label><label><input type="checkbox" id="pay" checked>仅显示加美且时薪下限 ≥25</label><div id="list"></div>
<script>
let rows=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function post(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error('请求失败 '+r.status);return r.json()}
function render(){const selected=rows.filter(j=>(!$('pay').checked||(j.pay.eligible&&j.country))&&(!$('confirmed').checked||j.term==='confirmed')&&j.location.toLowerCase().includes($('location').value.toLowerCase())&&(Date.now()-Date.parse(j.first_seen))<Number($('days').value)*86400000);$('list').innerHTML=selected.length?selected.map(j=>{let url;try{url=new URL(j.url)}catch{return ''}if(url.protocol!=='https:')return '';return `<article><small>${esc(j.company)} · ${esc(j.location)}</small><h2>${esc(j.title)}</h2><p>匹配分 ${j.score}/100 · ${j.term==='confirmed'?'Summer 2027 明确':'学期待确认'}</p><p>时薪下限：${j.pay.floor===null?'待确认':esc(j.pay.currency)+' '+j.pay.floor} · ${j.pay.eligible?'满足最低工资要求':'不进入投递队列'}</p><p class="tags">${j.reasons.map(esc).join(' · ')}</p><small>首次发现 ${esc(j.first_seen.slice(0,10))} · 发布日期 ${esc(j.published?.slice(0,10)||'来源未提供')}（发现时间不等于发布时间）</small><p><a href="${esc(url.href)}" target="_blank" rel="noopener noreferrer">打开申请页面</a> <select data-id="${esc(j.id)}">${[['new','未处理'],['saved','已收藏'],['applied','已投递（手动确认）'],['dismissed','不考虑']].map(([v,t])=>`<option value="${v}" ${j.status===v?'selected':''}>${t}</option>`).join('')}</select></p></article>`}).join(''):'<article>暂无符合条件的岗位。可取消学期筛选查看待确认岗位，或修改 sources.json 添加公司招聘源。</article>';document.querySelectorAll('[data-id]').forEach(el=>el.onchange=async()=>{try{await post('/api/status',{id:el.dataset.id,status:el.value});await load()}catch(e){$('message').textContent=e.message}})}
async function load(){rows=await(await fetch('/api/jobs')).json();render()}
$('refresh').onclick=async()=>{$('refresh').disabled=true;$('message').textContent='正在收集…';try{const r=await post('/api/refresh',{});$('message').textContent=`本次匹配 ${r.matched} 条；来源错误 ${r.errors.length}`+(r.errors.length?'\n'+JSON.stringify(r.errors):'');await load()}catch(e){$('message').textContent=e.message}finally{$('refresh').disabled=false}};
['location','confirmed','days','pay'].forEach(id=>$(id).oninput=render);load().catch(e=>$('message').textContent=e.message);
</script></html>
